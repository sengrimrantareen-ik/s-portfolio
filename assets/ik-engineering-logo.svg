<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ik-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8b35" />
      <stop offset="100%" stop-color="#ff3d00" />
    </linearGradient>
    <filter id="ik-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff6a3d" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#120e0c" stroke="rgba(255, 106, 61, 0.4)" stroke-width="1.5" />
  <circle cx="24" cy="24" r="18" fill="none" stroke="rgba(255, 106, 61, 0.15)" stroke-width="1" stroke-dasharray="2 3" />
  <!-- Circuit Nodes -->
  <circle cx="8" cy="8" r="1.5" fill="#ff8b35" />
  <path d="M8 8 L14 14" stroke="rgba(255, 106, 61, 0.3)" stroke-width="1" />
  <circle cx="40" cy="40" r="1.5" fill="#ff6a3d" />
  <path d="M40 40 L34 34" stroke="rgba(255, 106, 61, 0.3)" stroke-width="1" />
  <!-- Monogram IK -->
  <g filter="url(#ik-glow)" fill="none" stroke="url(#ik-grad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter I -->
    <line x1="16" y1="14" x2="16" y2="34" />
    <line x1="12" y1="14" x2="20" y2="14" stroke-width="2.2" />
    <line x1="12" y1="34" x2="20" y2="34" stroke-width="2.2" />
    <!-- Letter K -->
    <line x1="25" y1="14" x2="25" y2="34" />
    <line x1="35" y1="15" x2="26" y2="24" />
    <line x1="28" y1="22" x2="36" y2="33" />
  </g>
  <!-- Small Tech Dot -->
  <circle cx="25" cy="24" r="1.5" fill="#ffffff" />
</svg>
